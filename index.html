<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PixelRobux Shop — Техподдержка</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0f;
      --dark-blue: #1e2a44;
      --purple: #6b4eff;
      --purple-light: #8a6fff;
      --white: #ffffff;
      --muted: #a0aec0;
      --disabled: #4b5563;
      --glass-bg: rgba(30, 42, 68, 0.7);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', sans-serif; 
      font-weight: 500; 
      line-height: 1.5; 
      background: radial-gradient(circle at 30% 30%, #0f172a 0%, #2a1e5a 100%); 
      color: var(--white); 
      animation: gradientShift 15s ease infinite; 
      background-size: 150% 150%; 
      overflow-x: hidden; 
    }
    @keyframes gradientShift {
      0% { background-position: 30% 30%; }
      50% { background-position: 70% 70%; }
      100% { background-position: 30% 30%; }
    }
    canvas { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: -1; 
      pointer-events: none; 
    }
    .container { max-width: 980px; margin: 40px auto; padding: 24px; position: relative; }
    header { display: flex; align-items: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .brand { font-weight: 700; font-size: 26px; color: var(--purple); text-shadow: 0 0 10px rgba(107, 78, 255, 0.5); }
    .card { 
      background: var(--glass-bg); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      border-radius: 12px; 
      padding: 28px; 
      margin-top: 24px; 
      box-shadow: var(--glass-shadow); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      transition: transform 0.3s, box-shadow 0.3s; 
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(107, 78, 255, 0.3); }
    .packs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .pack { 
      background: var(--glass-bg); 
      backdrop-filter: blur(8px); 
      -webkit-backdrop-filter: blur(8px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 16px; 
      border-radius: 10px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      align-items: flex-start; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .pack:hover { border-color: var(--purple-light); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(107, 78, 255, 0.3); }
    .pack.selected { border-color: var(--purple); box-shadow: 0 6px 24px rgba(107, 78, 255, 0.4); background: rgba(107, 78, 255, 0.1); }
    .pack h4 { margin: 0; font-size: 18px; font-weight: 600; }
    .price { font-weight: 700; font-size: 16px; color: var(--purple); }
    .badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn { 
      background: linear-gradient(135deg, var(--purple), var(--purple-light)); 
      color: var(--white); 
      padding: 12px 16px; 
      border-radius: 10px; 
      border: 0; 
      font-weight: 700; 
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s; 
      text-decoration: none; 
    }
    .btn:hover:not(.disabled) { transform: scale(1.05); box-shadow: 0 4px 16px rgba(107, 78, 255, 0.5); }
    .btn.disabled { 
      background: var(--disabled); 
      color: #9ca3af; 
      cursor: not-allowed; 
      transform: none; 
      box-shadow: none; 
      pointer-events: none; 
    }
    .btn.secondary { background: transparent; border: 2px solid var(--purple); color: var(--purple); }
    .btn.secondary:hover:not(.disabled) { background: rgba(107, 78, 255, 0.1); }
    footer { margin-top: 36px; color: var(--muted); font-size: 14px; text-align: center; }
    .support { 
      margin-top: 28px; 
      padding: 16px; 
      background: var(--glass-bg); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      box-shadow: var(--glass-shadow); 
    }
    .support h3 { margin-bottom: 12px; font-size: 18px; font-weight: 700; }
    .support button { 
      display: inline-block; 
      margin: 6px 4px 0 0; 
      cursor: pointer; 
      padding: 10px 16px; 
      border-radius: 10px; 
      border: none; 
      background: linear-gradient(135deg, var(--purple), var(--purple-light)); 
      color: var(--white); 
      font-weight: 600; 
      transition: transform 0.2s, box-shadow 0.2s; 
    }
    .support button:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(107, 78, 255, 0.5); }
    .chat-messages { margin-top: 14px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .msg { 
      padding: 10px 14px; 
      border-radius: 12px; 
      max-width: 75%; 
      animation: fadeIn 0.3s; 
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(5px); 
      -webkit-backdrop-filter: blur(5px); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
    }
    .msg.seller { background: rgba(16, 185, 129, 0.2); align-self: flex-start; }
    .msg.buyer { background: rgba(107, 78, 255, 0.2); align-self: flex-end; }
    label { font-weight: 600; display: block; margin-top: 12px; }
    input[type=text] { 
      padding: 10px; 
      border-radius: 10px; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      width: 100%; 
      margin-top: 6px; 
      background: rgba(255, 255, 255, 0.1); 
      color: var(--white); 
      transition: 0.3s; 
    }
    input[type=text]:focus { border-color: var(--purple); outline: none; box-shadow: 0 0 8px rgba(107, 78, 255, 0.3); }
    input[type=text]::placeholder { color: var(--muted); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <header>
      <div class="brand">PixelRobux Shop</div>
    </header>

    <div class="card">
      <label for="buyerName">Введите ваше имя перед покупкой:</label>
      <input type="text" id="buyerName" placeholder="Например: Иван">

      <div class="packs" id="packs">
        <div class="pack" data-id="p1" data-amount="80" data-price="127"><h4>80 Robux</h4><div class="price">127 ₽</div></div>
        <div class="pack" data-id="p2" data-amount="200" data-price="365"><h4>200 Robux</h4><div class="price">365 ₽</div></div>
        <div class="pack" data-id="p3" data-amount="400" data-price="700"><h4>400 Robux</h4><div class="price">700 ₽</div></div>
        <div class="pack" data-id="p4" data-amount="500" data-price="734"><h4>500 Robux <span class="badge">ВЫГОДНО</span></h4><div class="price">734 ₽</div></div>
        <div class="pack" data-id="p5" data-amount="1000" data-price="1200"><h4>1000 Robux</h4><div class="price">1200 ₽</div></div>
        <div class="pack" data-id="p6" data-amount="2000" data-price="1948"><h4>2000 Robux <span class="badge">ВЫГОДНО</span></h4><div class="price">1948 ₽</div></div>
        <div class="pack" data-id="p7" data-amount="5000" data-price="5999"><h4>5000 Robux <span class="badge">ВЫГОДНО</span></h4><div class="price">5999 ₽</div></div>
      </div>

      <div class="actions">
        <button class="btn disabled" id="supportBtn" disabled>Открыть техподдержку</button>
        <a href="https://t.me/PixelRobuxShopBot?start=buy" class="btn disabled" id="buyBtn">Оформить заказ</a>
        <button class="btn secondary" id="resetBtn">Сброс</button>
      </div>

      <div id="supportSection" class="support" style="display:none">
        <h3>Техподдержка</h3>
        <div class="chat-messages" id="chatMessages"></div>
        <button onclick="sendSupportMessage('Здравствуйте! 👋', 'Здравствуйте! Чем могу помочь?')">Здравствуйте 👋</button>
        <button onclick="sendSupportMessage('Как купить Robux?', 'Robux можно купить через наш Telegram-бот @PixelRobuxShopBot.')">Как купить Robux?</button>
        <button onclick="sendSupportMessage('Где пополнить баланс?', 'Пополнить баланс можно в Telegram-боте @PixelRobuxShopBot.')">Где пополнить баланс?</button>
        <button onclick="sendSupportMessage('Как избежать мошенников?', 'Используйте только официальные каналы PixelRobux Shop, избегайте сторонних сайтов.')">Как избежать мошенников?</button>
      </div>
    </div>

    <footer>
      PixelRobux - лучший сайт для покупки Robux.
    </footer>
  </div>

  <script>
    const packs = document.querySelectorAll('.pack');
    let selectedPack = null;
    const resetBtn = document.getElementById('resetBtn');
    const supportBtn = document.getElementById('supportBtn');
    const buyBtn = document.getElementById('buyBtn');
    const supportSection = document.getElementById('supportSection');
    const chatMessages = document.getElementById('chatMessages');
    const buyerNameInput = document.getElementById('buyerName');

    // Проверка условий для активации кнопок
    function checkButtons() {
      const nameEntered = buyerNameInput.value.trim() !== '';
      const isValid = nameEntered && selectedPack;
      supportBtn.disabled = !isValid;
      supportBtn.classList.toggle('disabled', !isValid);
      buyBtn.classList.toggle('disabled', !isValid);
    }

    // Обработчик выбора пакета
    packs.forEach(pack => {
      pack.addEventListener('click', () => {
        if (selectedPack) selectedPack.classList.remove('selected');
        selectedPack = pack;
        pack.classList.add('selected');
        checkButtons();
      });
    });

    // Обработчик ввода имени
    buyerNameInput.addEventListener('input', checkButtons);

    // Показать/скрыть техподдержку
    supportBtn.addEventListener('click', () => {
      if (!supportBtn.disabled) {
        supportSection.style.display = supportSection.style.display === 'none' ? 'block' : 'none';
      }
    });

    // Сброс выбора
    resetBtn.addEventListener('click', () => {
      if (selectedPack) selectedPack.classList.remove('selected');
      selectedPack = null;
      buyerNameInput.value = '';
      supportSection.style.display = 'none';
      chatMessages.innerHTML = '';
      supportBtn.disabled = true;
      supportBtn.classList.add('disabled');
      buyBtn.classList.add('disabled');
    });

    // Отправка сообщений в чат
    function sendSupportMessage(question, response) {
      // Пользовательский вопрос (справа)
      const msg = document.createElement('div');
      msg.className = 'msg buyer';
      msg.textContent = question;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      
      // Ответ техподдержки (слева)
      setTimeout(() => {
        const reply = document.createElement('div');
        reply.className = 'msg seller';
        reply.textContent = response;
        chatMessages.appendChild(reply);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 1000);
    }

    // Анимация частиц
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];

    // Установка размеров canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Класс частицы
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.opacity = Math.random() * 0.5 + 0.3;
        this.color = Math.random() > 0.5 ? '#ffffff' : '#6b4eff';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity += Math.random() * 0.02 - 0.01;
        if (this.opacity <= 0.2 || this.opacity >= 0.8) this.opacity = 0.5;
        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.fill();
      }
    }

    // Инициализация частиц
    function initParticles() {
      particlesArray = [];
      const numberOfParticles = 100;
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }
    initParticles();

    // Анимация
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(particle => {
        particle.update();
        particle.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
